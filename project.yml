name: FoldCheck
options:
  bundleIdPrefix: com.jackyu
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: false
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false
    ENABLE_USER_SCRIPT_SANDBOXING: true
    SWIFT_STRICT_CONCURRENCY: complete
  configs:
    Debug:
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    Release:
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym

packages:
  FoldKit:
    path: Packages/FoldKit
  HingeAnalysis:
    path: Packages/HingeAnalysis
  TestsKit:
    path: Packages/TestsKit
  ReportKit:
    path: Packages/ReportKit
  FoldL10n:
    path: Packages/FoldL10n
  Library:
    path: Packages/Library
  Store:
    path: Packages/Store

targets:
  FoldCheck:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "**/.DS_Store"
    resources:
      - path: App/Resources
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jackyu.foldcheck
        PRODUCT_NAME: FoldCheck
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
        SWIFT_EMIT_LOC_STRINGS: true
        DEVELOPMENT_LANGUAGE: en
        # The hinge API (onHingeChange) ships in the iOS 27.1 SDK (assumed, spec §0). These turn
        # on FOLDCHECK_HINGE_API only when building with that SDK or newer, so today's Xcode 26
        # builds keep compiling; the code also checks `#available(iOS 27.1, *)` at run time.
        "SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphone*27.1*]": "$(inherited) FOLDCHECK_HINGE_API"
        "SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphone*27.2*]": "$(inherited) FOLDCHECK_HINGE_API"
        "SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphone*27.3*]": "$(inherited) FOLDCHECK_HINGE_API"
        "SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphone*27.4*]": "$(inherited) FOLDCHECK_HINGE_API"
        "SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphone*27.5*]": "$(inherited) FOLDCHECK_HINGE_API"
        "SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphone*27.6*]": "$(inherited) FOLDCHECK_HINGE_API"
        "SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphone*27.7*]": "$(inherited) FOLDCHECK_HINGE_API"
        "SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphone*27.8*]": "$(inherited) FOLDCHECK_HINGE_API"
        "SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphone*27.9*]": "$(inherited) FOLDCHECK_HINGE_API"
        "SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphone*28.*]": "$(inherited) FOLDCHECK_HINGE_API"
        "SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphone*29.*]": "$(inherited) FOLDCHECK_HINGE_API"
        "SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphone*30.*]": "$(inherited) FOLDCHECK_HINGE_API"
    dependencies:
      - package: FoldKit
      - package: HingeAnalysis
      - package: TestsKit
      - package: ReportKit
      - package: FoldL10n
      - package: Library
      - package: Store
    entitlements:
      path: App/FoldCheck.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.jackyu.foldcheck
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.jackyu.foldcheck
    preBuildScripts: []
    postBuildScripts: []

  FoldCheckTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes:
          - "**/.DS_Store"
      # SKTestSession loads the StoreKit configuration from the test bundle.
      - path: Configuration.storekit
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jackyu.foldcheck.tests
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: FoldCheck

  FoldCheckUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jackyu.foldcheck.uitests
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: FoldCheck

schemes:
  FoldCheck:
    build:
      targets:
        FoldCheck: all
        FoldCheckTests: [test]
        FoldCheckUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: Configuration.storekit
      commandLineArguments:
        "-FoldDebugOverlay": false
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - FoldCheckTests
        - FoldCheckUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  FoldCheck-MockHinge:
    build:
      targets:
        FoldCheck: all
    run:
      config: Debug
      storeKitConfiguration: Configuration.storekit
      # XcodeGen maps each key to one argument string and the value to its checkbox,
      # so the -FoldMock value must be part of the key. Tick one alternative at a time.
      commandLineArguments:
        "-UITestMode 1": true
        "-FoldMock sweep:10-180:6": true
        "-FoldMock open": false
        "-FoldMock closed": false
        "-FoldMock half:95": false
        "-FoldMock nohinge": false
        "-FoldDebugOverlay": true
