name: FoldCheck
options:
  bundleIdPrefix: com.jackyu
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: false
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false
    ENABLE_USER_SCRIPT_SANDBOXING: true
    SWIFT_STRICT_CONCURRENCY: complete
  configs:
    Debug:
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    Release:
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym

packages:
  FoldKit:
    path: Packages/FoldKit
  HingeAnalysis:
    path: Packages/HingeAnalysis
  TestsKit:
    path: Packages/TestsKit
  ReportKit:
    path: Packages/ReportKit
  FoldL10n:
    path: Packages/FoldL10n

targets:
  FoldCheck:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "**/.DS_Store"
    resources:
      - path: App/Resources
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jackyu.foldcheck
        PRODUCT_NAME: FoldCheck
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
        SWIFT_EMIT_LOC_STRINGS: true
        DEVELOPMENT_LANGUAGE: en
    dependencies:
      - package: FoldKit
      - package: HingeAnalysis
      - package: TestsKit
      - package: ReportKit
      - package: FoldL10n
    entitlements:
      path: App/FoldCheck.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.jackyu.foldcheck
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.jackyu.foldcheck
    preBuildScripts: []
    postBuildScripts: []

  FoldCheckTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jackyu.foldcheck.tests
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: FoldCheck

  FoldCheckUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jackyu.foldcheck.uitests
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: FoldCheck

schemes:
  FoldCheck:
    build:
      targets:
        FoldCheck: all
        FoldCheckTests: [test]
        FoldCheckUITests: [test]
    run:
      config: Debug
      commandLineArguments:
        "-FoldDebugOverlay": false
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - FoldCheckTests
        - FoldCheckUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  FoldCheck-MockHinge:
    build:
      targets:
        FoldCheck: all
    run:
      config: Debug
      commandLineArguments:
        "-UITestMode": true
        "-FoldMock": "sweep:10-180:6"
        "-FoldDebugOverlay": true
