<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<title>FoldCheck · Home · Unfolded</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1040px; height: 680px; overflow: hidden; background: #e4e7ee; }
  body { font-family: "WenQuanYi Micro Hei", "DejaVu Sans", sans-serif; color: #1c1e21; }
  .caption { height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 28px; }
  .caption h1 { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
  .caption span { font-size: 12px; color: #5c6370; }
  .stage { height: 628px; display: flex; align-items: center; justify-content: center; }
  .device {
    width: 980px; height: 560px; background: linear-gradient(180deg, #3a3d44, #1e2024);
    border-radius: 36px; padding: 12px; position: relative;
    box-shadow: 0 18px 40px rgba(20,24,32,0.28);
  }
  .screen { width: 100%; height: 100%; background: #f7f8fa; border-radius: 26px; position: relative; overflow: hidden; display: flex; flex-direction: column; }
  .crease {
    position: absolute; top: 0; bottom: 0; left: 50%; width: 10px; transform: translateX(-50%);
    background: linear-gradient(90deg, rgba(0,0,0,0), rgba(0,0,0,0.16), rgba(255,255,255,0.55), rgba(0,0,0,0.16), rgba(0,0,0,0));
    pointer-events: none; z-index: 4;
  }
  .status { height: 28px; display: flex; align-items: center; justify-content: space-between; padding: 0 22px; font-size: 12px; font-weight: 700; }
  .status .mid { color: #6b7280; font-weight: 500; font-size: 11px; }
  .body { flex: 1; display: flex; min-height: 0; }
  .half { width: 50%; padding: 8px 36px 12px; display: flex; flex-direction: column; justify-content: center; }
  .half.right { justify-content: flex-start; padding-top: 18px; }
  .brand { font-size: 11px; letter-spacing: 0.16em; color: #0e7a45; font-weight: 700; }
  .title { font-size: 32px; line-height: 1.15; margin-top: 10px; font-weight: 700; }
  .sub { margin-top: 8px; color: #5c6370; font-size: 14px; line-height: 1.45; max-width: 360px; }
  .btn { margin-top: 22px; background: #1c1e21; color: white; border-radius: 14px; height: 52px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; width: 100%; }
  .hint { margin-top: 10px; font-size: 12px; color: #6b7280; }
  .right h2 { font-size: 13px; color: #5c6370; font-weight: 700; margin-bottom: 8px; }
  .card { background: white; border-radius: 14px; padding: 12px 14px; box-shadow: 0 1px 0 rgba(0,0,0,0.04); border: 1px solid #e6e8ee; }
  .row { display: flex; justify-content: space-between; align-items: center; }
  .badge { background: #e5f6ec; color: #0e7a45; border-radius: 999px; padding: 3px 8px; font-size: 12px; font-weight: 700; }
  .meta { color: #6b7280; font-size: 12px; margin-top: 4px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .tile { background: white; border: 1px solid #e6e8ee; border-radius: 12px; padding: 10px 12px; }
  .tile b { display: block; font-size: 13px; margin-top: 4px; }
  .tile span { font-size: 11px; color: #6b7280; }
  .ico { width: 22px; height: 22px; }
  .tabs { height: 52px; border-top: 1px solid #e6e8ee; display: flex; background: rgba(255,255,255,0.92); }
  .tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 11px; color: #6b7280; gap: 2px; }
  .tab.on { color: #0e7a45; font-weight: 700; }
</style>
</head>
<body>
  <div class="caption">
    <h1>FoldCheck · 首页</h1>
    <span>iPhone Duo · 完全展开 · 内屏（左右两半，中间折痕）</span>
  </div>
  <div class="stage">
    <div class="device">
      <div class="screen">
        <div class="crease"></div>
        <div class="status"><span>9:41</span><span class="mid">内屏 · fully open</span><span>100%</span></div>
        <div class="body">
          <div class="half">
            <div class="brand">FOLDCHECK</div>
            <div class="title">折叠机体检</div>
            <div class="sub">铰链、折痕、双屏触控和摄像头。大约 5 分钟，报告留在这台 Duo 上。</div>
            <div class="btn">开始体检</div>
            <div class="hint">展开状态已识别 · 将先测内屏，再提示合盖测外屏</div>
          </div>
          <div class="half right">
            <h2>上次结果</h2>
            <div class="card">
              <div class="row">
                <div>
                  <b>10月13日</b>
                  <div class="meta">iPhone Duo · 5分23秒</div>
                </div>
                <span class="badge">通过 92</span>
              </div>
            </div>
            <h2 style="margin-top:12px">快捷测试</h2>
            <div class="grid">
              <div class="tile"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="#0e7a45" stroke-width="1.8"><path d="M4 12a8 8 0 1 0 3-6.3"/><path d="M4 4v5h5"/></svg><b>铰链扫掠</b><span>连续性</span></div>
              <div class="tile"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="#0e7a45" stroke-width="1.8"><path d="M8 11V7a2 2 0 1 1 4 0v4"/><path d="M12 11V5a2 2 0 1 1 4 0v8"/><path d="M8 11a2 2 0 0 0-4 1v1a8 8 0 0 0 16 0v-2a2 2 0 0 0-4 0"/></svg><b>折痕触控</b><span>内屏加密带</span></div>
              <div class="tile"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="#0e7a45" stroke-width="1.8"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M4 15h16"/></svg><b>像素</b><span>纯色全屏</span></div>
              <div class="tile"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="#0e7a45" stroke-width="1.8"><path d="M4 18V6M12 18V6M20 18V6"/></svg><b>折痕可见度</b><span>三个角度</span></div>
            </div>
          </div>
        </div>
        <div class="tabs">
          <div class="tab on">首页</div>
          <div class="tab">记录</div>
          <div class="tab">核验</div>
          <div class="tab">设置</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
