<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<title>FoldCheck · Test intro</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1040px; height: 680px; overflow: hidden; background: #e4e7ee; }
  body { font-family: "WenQuanYi Micro Hei", "DejaVu Sans", sans-serif; color: #1c1e21; }
  .caption { height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 28px; }
  .caption h1 { font-size: 15px; font-weight: 700; }
  .caption span { font-size: 12px; color: #5c6370; }
  .stage { height: 628px; display: flex; align-items: center; justify-content: center; }
  .device { width: 980px; height: 560px; background: linear-gradient(180deg, #3a3d44, #1e2024); border-radius: 36px; padding: 12px; box-shadow: 0 18px 40px rgba(20,24,32,0.28); }
  .screen { width: 100%; height: 100%; background: #f7f8fa; border-radius: 26px; position: relative; overflow: hidden; display: flex; flex-direction: column; }
  .crease { position: absolute; top: 0; bottom: 0; left: 50%; width: 10px; transform: translateX(-50%); background: linear-gradient(90deg, rgba(0,0,0,0), rgba(0,0,0,0.16), rgba(255,255,255,0.55), rgba(0,0,0,0.16), rgba(0,0,0,0)); z-index: 4; }
  .status { height: 28px; display: flex; justify-content: space-between; align-items: center; padding: 0 22px; font-size: 12px; font-weight: 700; }
  .status .mid { color: #6b7280; font-weight: 500; font-size: 11px; }
  .top { padding: 8px 28px 0; }
  .bar { height: 6px; background: #e6e8ee; border-radius: 99px; overflow: hidden; }
  .bar i { display: block; width: 40%; height: 100%; background: #0e7a45; }
  .prog { display: flex; justify-content: space-between; font-size: 12px; color: #6b7280; margin-top: 6px; }
  .body { flex: 1; display: flex; min-height: 0; }
  .half { width: 50%; padding: 18px 36px; display: flex; flex-direction: column; justify-content: center; }
  .kicker { font-size: 12px; letter-spacing: 0.12em; color: #0e7a45; font-weight: 700; }
  h2 { font-size: 30px; margin: 8px 0 10px; }
  ol { margin-left: 18px; color: #3a4150; font-size: 15px; line-height: 1.7; }
  .btn { margin-top: 22px; background: #1c1e21; color: #fff; height: 50px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-weight: 700; }
  .skip { margin-top: 10px; text-align: center; color: #6b7280; font-size: 13px; }
  .visual { background: #111418; border-radius: 18px; height: 360px; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
  .arc { width: 220px; height: 120px; border: 6px solid #0e7a45; border-bottom: none; border-radius: 220px 220px 0 0; position: relative; }
  .needle { position: absolute; left: 104px; bottom: 0; width: 6px; height: 100px; background: #fff; transform-origin: bottom center; transform: rotate(28deg); border-radius: 4px; }
  .deg { margin-top: 18px; font-size: 28px; font-weight: 700; }
  .note { color: #9aa3b2; font-size: 13px; margin-top: 4px; }
</style>
</head>
<body>
  <div class="caption">
    <h1>FoldCheck · 测试介绍</h1>
    <span>iPhone Duo · 完全展开 · 左半说明，右半示意（控件避开折痕）</span>
  </div>
  <div class="stage">
    <div class="device"><div class="screen">
      <div class="crease"></div>
      <div class="status"><span>9:42</span><span class="mid">内屏 · fully open</span><span>4 / 10</span></div>
      <div class="top">
        <div class="bar"><i></i></div>
        <div class="prog"><span>第 4 项，共 10 项</span><span>铰链扫掠</span></div>
      </div>
      <div class="body">
        <div class="half">
          <div class="kicker">HINGE SWEEP</div>
          <h2>铰链扫掠</h2>
          <ol>
            <li>慢慢合到大约 20°</li>
            <li>再慢慢展平，重复两次</li>
            <li>在约 90° 停住 5 秒</li>
          </ol>
          <div class="btn">开始测试</div>
          <div class="skip">跳过</div>
        </div>
        <div class="half">
          <div class="visual">
            <div class="arc"><div class="needle"></div></div>
            <div class="deg">127°</div>
            <div class="note">只看连续性，不判断绝对角度是否准</div>
          </div>
        </div>
      </div>
    </div></div>
  </div>
</body>
</html>
