<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FoldCheck · Touch grid</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1040px; height: 680px; overflow: hidden; background: #e4e7ee; }
  body { font-family: "WenQuanYi Micro Hei", "DejaVu Sans", sans-serif; color: #1c1e21; }
  .caption { height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 28px; }
  .caption h1 { font-size: 15px; font-weight: 700; }
  .caption span { font-size: 12px; color: #5c6370; }
  .stage { height: 628px; display: flex; align-items: center; justify-content: center; }
  .device { width: 980px; height: 560px; background: linear-gradient(180deg, #3a3d44, #1e2024); border-radius: 36px; padding: 12px; box-shadow: 0 18px 40px rgba(20,24,32,0.28); }
  .screen { width: 100%; height: 100%; background: #0e1013; border-radius: 26px; position: relative; overflow: hidden; color: #fff; }
  .hud { position: absolute; top: 16px; left: 24px; right: 24px; z-index: 5; display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
  .bar { width: 280px; height: 6px; background: #2a2e35; border-radius: 99px; overflow: hidden; }
  .bar i { display: block; width: 62%; height: 100%; background: #0e7a45; }
  .grid { position: absolute; inset: 52px 20px 48px; display: grid; grid-template-columns: repeat(22, 1fr); grid-template-rows: repeat(8, 1fr); gap: 4px; }
  .c { background: #2a3038; border-radius: 3px; }
  .c.on { background: #0e7a45; }
  .band { display: grid; grid-template-rows: 1fr 1fr; gap: 3px; }
  .band i { display: block; background: #c47b12; border-radius: 2px; }
  .band i.on { background: #0e7a45; }
  .foot { position: absolute; left: 24px; right: 24px; bottom: 14px; display: flex; justify-content: space-between; font-size: 12px; color: #c9d0da; }
  .skip { background: rgba(255,255,255,0.12); border-radius: 999px; padding: 6px 12px; }
</style>
</head>
<body>
  <div class="caption">
    <h1>FoldCheck · Inner touch</h1>
    <span>iPhone Duo · fully open · half-size cells within ±10 mm of the crease</span>
  </div>
  <div class="stage">
    <div class="device"><div class="screen">
      <div class="hud">
        <div>Fill every cell · 62% covered</div>
        <div class="bar"><i></i></div>
        <div>Inner display</div>
      </div>
      <div class="grid" id="g"></div>
      <div class="foot">
        <span>Amber band = crease grid. No buttons here.</span>
        <span class="skip">Skip</span>
      </div>
    </div></div>
  </div>
<script>
  const g = document.getElementById('g');
  for (let row = 0; row < 8; row++) {
    for (let col = 0; col < 22; col++) {
      const near = col >= 9 && col <= 12;
      const filled = col < 9 || (col <= 13 && row < 5);
      const el = document.createElement('div');
      el.style.gridColumn = String(col + 1);
      el.style.gridRow = String(row + 1);
      if (near) {
        el.className = 'band';
        const a = document.createElement('i');
        const b = document.createElement('i');
        if (filled) { a.className = 'on'; b.className = 'on'; }
        el.appendChild(a); el.appendChild(b);
      } else {
        el.className = 'c' + (filled ? ' on' : '');
      }
      g.appendChild(el);
    }
  }
</script>
</body>
</html>
