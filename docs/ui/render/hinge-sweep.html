<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro', 'Helvetica Neue', sans-serif; background: #f5f5f7; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
.iphone { width: 390px; height: 844px; background: #000; border-radius: 50px; padding: 15px; }
.screen { width: 100%; height: 100%; background: #1c1c1e; border-radius: 40px; overflow: hidden; position: relative; color: white; }
.status-bar { height: 44px; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; }
.time { font-size: 15px; font-weight: 600; }
.content { padding: 20px; padding-top: 40px; }
.angle { font-size: 72px; font-weight: 700; text-align: center; }
.angle-label { font-size: 15px; color: #8e8e93; text-align: center; margin-top: 8px; }
.stats-box { background: #2c2c2e; border-radius: 16px; padding: 20px; margin-top: 40px; }
.stats-row { display: flex; justify-content: space-around; margin-bottom: 20px; }
.stat { text-align: center; }
.stat-value { font-size: 24px; font-weight: 600; }
.stat-label { font-size: 12px; color: #8e8e93; margin-top: 4px; }
.chart { height: 80px; background: #3c3c3e; border-radius: 8px; position: relative; overflow: hidden; }
.chart svg { position: absolute; width: 100%; height: 100%; }
.instruction { text-align: center; color: #8e8e93; font-size: 15px; margin-top: 40px; }
.sweep-counter { display: inline-block; background: #2c2c2e; padding: 12px 24px; border-radius: 20px; margin-top: 20px; }
.dots { display: flex; justify-content: center; gap: 10px; margin-top: 60px; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: #3c3c3e; }
.dot.active { background: #007aff; }
</style>
</head>
<body>
<div class="iphone">
<div class="screen">
<div class="status-bar"><span class="time">9:43</span><span>100%</span></div>
<div class="content">
<div class="angle">127°</div>
<div class="angle-label">Angle</div>
<div class="stats-box">
<div class="stats-row">
<div class="stat"><div class="stat-value">5°</div><div class="stat-label">Min</div></div>
<div class="stat"><div class="stat-value">175°</div><div class="stat-label">Max</div></div>
<div class="stat"><div class="stat-value">30 Hz</div><div class="stat-label">Rate</div></div>
</div>
<div class="chart">
<svg viewBox="0 0 300 80" preserveAspectRatio="none">
<path d="M0,60 Q30,40 60,45 T120,30 T180,35 T240,25 T300,40" fill="none" stroke="#007aff" stroke-width="2"/>
</svg>
</div>
</div>
<div class="instruction">Close slowly, then open slowly...</div>
<div style="text-align: center;"><div class="sweep-counter">Sweep 1 of 2</div></div>
<div class="dots">
<div class="dot active"></div>
<div class="dot"></div>
<div class="dot"></div>
</div>
</div>
</div>
</div>
</body>
</html>
