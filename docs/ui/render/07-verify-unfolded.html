<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<title>FoldCheck · Verify</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1040px; height: 680px; overflow: hidden; background: #e4e7ee; }
  body { font-family: "WenQuanYi Micro Hei", "DejaVu Sans", sans-serif; color: #1c1e21; }
  .caption { height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 28px; }
  .caption h1 { font-size: 15px; font-weight: 700; }
  .caption span { font-size: 12px; color: #5c6370; }
  .stage { height: 628px; display: flex; align-items: center; justify-content: center; }
  .device { width: 980px; height: 560px; background: linear-gradient(180deg, #3a3d44, #1e2024); border-radius: 36px; padding: 12px; box-shadow: 0 18px 40px rgba(20,24,32,0.28); }
  .screen { width: 100%; height: 100%; background: #f7f8fa; border-radius: 26px; position: relative; overflow: hidden; display: flex; }
  .crease { position: absolute; top: 0; bottom: 0; left: 50%; width: 10px; transform: translateX(-50%); background: linear-gradient(90deg, rgba(0,0,0,0), rgba(0,0,0,0.16), rgba(255,255,255,0.55), rgba(0,0,0,0.16), rgba(0,0,0,0)); z-index: 4; }
  .half { width: 50%; padding: 32px 36px; display: flex; flex-direction: column; justify-content: center; }
  .kicker { font-size: 12px; letter-spacing: 0.12em; color: #0e7a45; font-weight: 700; }
  h2 { font-size: 28px; margin: 8px 0 8px; }
  p { color: #5c6370; font-size: 14px; line-height: 1.5; }
  .btn { margin-top: 16px; background: #1c1e21; color: #fff; height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-weight: 700; }
  .btn.alt { background: #fff; color: #1c1e21; border: 1px solid #d5d8e0; }
  .card { background: #e5f6ec; border-radius: 16px; padding: 18px; }
  .card h3 { color: #0e7a45; font-size: 22px; margin-bottom: 8px; }
  .row { display: flex; justify-content: space-between; font-size: 13px; margin-top: 6px; }
  .mono { font-family: "DejaVu Sans Mono", monospace; }
  ul { margin: 14px 0 0 0; list-style: none; font-size: 14px; line-height: 1.7; }
  .no { color: #c0392b; }
</style>
</head>
<body>
  <div class="caption">
    <h1>FoldCheck · 核验报告</h1>
    <span>iPhone Duo · 完全展开 · 左半操作，右半结果</span>
  </div>
  <div class="stage">
    <div class="device"><div class="screen">
      <div class="crease"></div>
      <div class="half">
        <div class="kicker">VERIFY</div>
        <h2>核验一份报告</h2>
        <p>扫描二维码，或导入 PDF。全程离线，不连接服务器。</p>
        <div class="btn">扫描二维码</div>
        <div class="btn alt">导入 PDF</div>
      </div>
      <div class="half">
        <div class="card">
          <h3>签名有效</h3>
          <div class="row"><span>报告 ID</span><span class="mono">a1b2c3d4</span></div>
          <div class="row"><span>密钥</span><span>另一台设备 · 7f3a91c2</span></div>
        </div>
        <ul>
          <li>PDF 生成后没有被改过</li>
          <li>由某一份 FoldCheck 安装签名</li>
          <li class="no">不能证明机器是原装</li>
          <li class="no">不能证明电池健康或终身折叠次数</li>
        </ul>
      </div>
    </div></div>
  </div>
</body>
</html>
