<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro', 'Helvetica Neue', sans-serif; background: #f5f5f7; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
.iphone { width: 390px; height: 844px; background: #000; border-radius: 50px; padding: 15px; }
.screen { width: 100%; height: 100%; background: #fff; border-radius: 40px; overflow: hidden; position: relative; }
.status-bar { height: 44px; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; }
.nav-bar { height: 44px; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid #e5e5e5; }
.nav-title { font-size: 17px; font-weight: 600; }
.content { padding: 16px; overflow-y: auto; height: calc(100% - 88px); }
.header { text-align: center; margin-bottom: 20px; }
.check-icon { font-size: 48px; color: #34c759; }
.title { font-size: 22px; font-weight: 700; margin-top: 8px; }
.duration { color: #8e8e93; font-size: 14px; margin-top: 4px; }
.score-card { background: #f2f2f7; border-radius: 12px; padding: 20px; text-align: center; margin-bottom: 20px; }
.score { font-size: 48px; font-weight: 700; color: #34c759; }
.score-label { font-size: 14px; color: #8e8e93; }
.stats-row { display: flex; justify-content: center; gap: 24px; margin-top: 16px; font-size: 14px; }
.stat-pass { color: #34c759; font-weight: 600; }
.stat-attention { color: #f59e0b; font-weight: 600; }
.stat-fail { color: #ef4444; font-weight: 600; }
.section-title { font-weight: 600; margin: 16px 0 8px; font-size: 15px; }
.result-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: #f2f2f7; border-radius: 10px; margin-bottom: 8px; }
.result-name { font-weight: 600; font-size: 14px; }
.result-detail { font-size: 12px; color: #8e8e93; margin-top: 2px; }
.badge { padding: 4px 10px; border-radius: 10px; font-size: 12px; font-weight: 600; }
.badge-pass { background: #d1fae5; color: #059669; }
.badge-attention { background: #fef3c7; color: #d97706; }
.btn-primary { background: #007aff; color: white; padding: 16px; border-radius: 12px; text-align: center; font-weight: 600; margin-top: 16px; }
.btn-link { text-align: center; color: #007aff; font-size: 14px; margin-top: 12px; }
</style>
</head>
<body>
<div class="iphone">
<div class="screen">
<div class="status-bar"><span>9:48</span><span>100%</span></div>
<div class="nav-bar"><span class="nav-title">Summary</span></div>
<div class="content">
<div class="header">
<div class="check-icon">✓</div>
<div class="title">Inspection Complete</div>
<div class="duration">Completed in 5m 23s</div>
</div>
<div class="score-card">
<div class="score">87</div>
<div class="score-label">out of 100</div>
<div class="stats-row">
<span><span class="stat-pass">7</span> Pass</span>
<span><span class="stat-attention">2</span> Attention</span>
<span><span class="stat-fail">0</span> Fail</span>
</div>
</div>
<div class="section-title">Test Results</div>
<div class="result-item">
<div><div class="result-name">Touch Grid (Outer)</div><div class="result-detail">Outer display</div></div>
<span class="badge badge-pass">✓ Pass</span>
</div>
<div class="result-item">
<div><div class="result-name">Hinge Sweep</div><div class="result-detail">Max gap: 12°</div></div>
<span class="badge badge-attention">⚠ Attention</span>
</div>
<div class="result-item">
<div><div class="result-name">Crease Visibility</div><div class="result-detail">Rating: 4/5</div></div>
<span class="badge badge-pass">✓ Pass</span>
</div>
<div class="btn-primary">📄 Create PDF Report</div>
<div class="btn-link">Save to History</div>
</div>
</div>
</div>
</body>
</html>
