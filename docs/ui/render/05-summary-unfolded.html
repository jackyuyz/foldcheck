<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<title>FoldCheck · Summary</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1040px; height: 680px; overflow: hidden; background: #e4e7ee; }
  body { font-family: "WenQuanYi Micro Hei", "DejaVu Sans", sans-serif; color: #1c1e21; }
  .caption { height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 28px; }
  .caption h1 { font-size: 15px; font-weight: 700; }
  .caption span { font-size: 12px; color: #5c6370; }
  .stage { height: 628px; display: flex; align-items: center; justify-content: center; }
  .device { width: 980px; height: 560px; background: linear-gradient(180deg, #3a3d44, #1e2024); border-radius: 36px; padding: 12px; box-shadow: 0 18px 40px rgba(20,24,32,0.28); }
  .screen { width: 100%; height: 100%; background: #f7f8fa; border-radius: 26px; position: relative; overflow: hidden; display: flex; }
  .crease { position: absolute; top: 0; bottom: 0; left: 50%; width: 10px; transform: translateX(-50%); background: linear-gradient(90deg, rgba(0,0,0,0), rgba(0,0,0,0.16), rgba(255,255,255,0.55), rgba(0,0,0,0.16), rgba(0,0,0,0)); z-index: 4; }
  .half { width: 50%; padding: 28px 36px; display: flex; flex-direction: column; justify-content: center; }
  .kicker { font-size: 12px; color: #0e7a45; letter-spacing: 0.12em; font-weight: 700; }
  h2 { font-size: 28px; margin: 6px 0; }
  .score { font-size: 84px; font-weight: 700; color: #0e7a45; line-height: 0.95; }
  .of { color: #6b7280; margin-bottom: 12px; }
  .counts { display: flex; gap: 18px; font-size: 14px; }
  .counts b.p { color: #0e7a45; } .counts b.a { color: #c47b12; } .counts b.f { color: #c0392b; }
  .btn { margin-top: 22px; background: #1c1e21; color: #fff; height: 50px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-weight: 700; }
  .item { display: flex; justify-content: space-between; align-items: center; background: #fff; border: 1px solid #e6e8ee; border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; }
  .item b { display: block; font-size: 14px; }
  .item span { font-size: 12px; color: #6b7280; }
  .pass { background: #e5f6ec; color: #0e7a45; border-radius: 99px; padding: 3px 8px; font-size: 12px; font-weight: 700; }
  .attn { background: #fff4df; color: #a16207; border-radius: 99px; padding: 3px 8px; font-size: 12px; font-weight: 700; }
  .na { background: #eceff3; color: #5c6370; border-radius: 99px; padding: 3px 8px; font-size: 12px; font-weight: 700; }
</style>
</head>
<body>
  <div class="caption">
    <h1>FoldCheck · 体检小结</h1>
    <span>iPhone Duo · 完全展开 · 左半总分，右半各项结果</span>
  </div>
  <div class="stage">
    <div class="device"><div class="screen">
      <div class="crease"></div>
      <div class="half">
        <div class="kicker">INSPECTION</div>
        <h2>体检完成</h2>
        <div class="score">87</div>
        <div class="of">满分 100 · 用时 5分23秒 · 内屏 + 外屏</div>
        <div class="counts"><span><b class="p">7</b> 通过</span><span><b class="a">2</b> 留意</span><span><b class="f">0</b> 未通过</span></div>
        <div class="btn">生成 PDF 报告</div>
      </div>
      <div class="half" style="justify-content:flex-start;padding-top:36px">
        <div class="item"><div><b>外屏触控</b><span>合盖 · 外屏</span></div><span class="pass">通过</span></div>
        <div class="item"><div><b>内屏触控</b><span>折痕带 100%</span></div><span class="pass">通过</span></div>
        <div class="item"><div><b>铰链扫掠</b><span>最大间隙 12°</span></div><span class="attn">留意</span></div>
        <div class="item"><div><b>折痕可见度</b><span>评分 4 / 5</span></div><span class="pass">通过</span></div>
        <div class="item"><div><b>内屏摄像头</b><span>合盖时不可用</span></div><span class="na">不适用</span></div>
        <div class="item"><div><b>外屏前置摄像头</b><span>清晰度正常</span></div><span class="pass">通过</span></div>
      </div>
    </div></div>
  </div>
</body>
</html>
