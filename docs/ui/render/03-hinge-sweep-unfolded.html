<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FoldCheck · Hinge sweep</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1040px; height: 680px; overflow: hidden; background: #e4e7ee; }
  body { font-family: "WenQuanYi Micro Hei", "DejaVu Sans", sans-serif; color: #f4f6f8; }
  .caption { height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 28px; color: #1c1e21; }
  .caption h1 { font-size: 15px; font-weight: 700; }
  .caption span { font-size: 12px; color: #5c6370; }
  .stage { height: 628px; display: flex; align-items: center; justify-content: center; }
  .device { width: 786px; height: 560px; background: linear-gradient(180deg, #3a3d44, #1e2024); border-radius: 36px; padding: 12px; box-shadow: 0 18px 40px rgba(20,24,32,0.28); }
  .screen { width: 100%; height: 100%; background: #121417; border-radius: 26px; position: relative; overflow: hidden; display: flex; }
  .crease { position: absolute; top: 0; bottom: 0; left: 50%; width: 10px; transform: translateX(-50%); background: linear-gradient(90deg, rgba(0,0,0,0), rgba(255,255,255,0.08), rgba(255,255,255,0.35), rgba(255,255,255,0.08), rgba(0,0,0,0)); z-index: 4; }
  .half { width: 50%; padding: 28px 40px; display: flex; flex-direction: column; justify-content: center; }
  .kicker { color: #8b93a1; font-size: 13px; }
  .angle { font-size: 92px; font-weight: 700; letter-spacing: -2px; line-height: 1; margin: 8px 0; }
  .stats { display: flex; gap: 22px; margin-top: 12px; }
  .stats b { display: block; font-size: 20px; }
  .stats span { color: #8b93a1; font-size: 12px; }
  .chart { background: #1c2026; border-radius: 16px; height: 280px; padding: 16px 16px 8px; }
  svg { width: 100%; height: 220px; }
  .legend { display: flex; justify-content: space-between; color: #8b93a1; font-size: 12px; margin-top: 6px; }
  .float { position: absolute; right: 36px; bottom: 22px; background: #2a2e35; color: #fff; border-radius: 999px; padding: 10px 16px; font-size: 13px; z-index: 5; }
  .pill { position: absolute; left: 36px; bottom: 22px; background: #0e7a45; color: #fff; border-radius: 999px; padding: 10px 16px; font-size: 13px; font-weight: 700; z-index: 5; }
</style>
</head>
<body>
  <div class="caption">
    <h1>FoldCheck · Hinge Sweep</h1>
    <span>iPhone Duo · fully open · full-screen test across both inner halves</span>
  </div>
  <div class="stage">
    <div class="device"><div class="screen">
      <div class="crease"></div>
      <div class="half">
        <div class="kicker">Recording · sweep 1 of 2</div>
        <div class="angle">127°</div>
        <div class="kicker">Close slowly, then open slowly. Too fast and we'll ask you to slow down.</div>
        <div class="stats">
          <div><b>5°</b><span>Min</span></div>
          <div><b>175°</b><span>Max</span></div>
          <div><b>1.2°</b><span>Max gap</span></div>
          <div><b>30 Hz</b><span>Samples</span></div>
        </div>
      </div>
      <div class="half">
        <div class="chart">
          <svg viewBox="0 0 360 200" preserveAspectRatio="none">
            <polyline fill="none" stroke="#3d4654" stroke-width="1" points="0,180 360,180"/>
            <polyline fill="none" stroke="#0e7a45" stroke-width="3" points="0,170 30,150 60,120 90,90 120,70 150,78 180,60 210,48 240,55 270,40 300,46 330,38 360,42"/>
          </svg>
          <div class="legend"><span>0s</span><span>Angle curve</span><span>6s</span></div>
        </div>
      </div>
      <div class="pill">Sweep 1 / 2</div>
      <div class="float">Done</div>
    </div></div>
  </div>
</body>
</html>
