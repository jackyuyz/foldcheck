<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro', 'Helvetica Neue', sans-serif; background: #f5f5f7; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
.iphone { width: 200px; height: 300px; background: #000; border-radius: 30px; padding: 10px; }
.screen { width: 100%; height: 100%; background: #fff; border-radius: 25px; overflow: hidden; position: relative; }
.status-bar { height: 30px; display: flex; justify-content: space-between; align-items: center; padding: 0 12px; font-size: 12px; }
.content { padding: 12px; text-align: center; }
.icon { font-size: 32px; margin-bottom: 8px; }
.title { font-size: 14px; font-weight: 600; }
.subtitle { font-size: 10px; color: #8e8e93; margin-top: 4px; margin-bottom: 12px; }
.card { background: #f2f2f7; border-radius: 8px; padding: 10px; margin-bottom: 10px; }
.card-label { font-size: 10px; color: #8e8e93; }
.card-value { font-size: 12px; font-weight: 600; margin-top: 2px; }
.btn { background: #007aff; color: white; padding: 10px; border-radius: 8px; font-size: 12px; font-weight: 600; }
.footer { font-size: 9px; color: #8e8e93; margin-top: 12px; }
</style>
</head>
<body>
<div class="iphone">
<div class="screen">
<div class="status-bar"><span>9:41</span><span>100%</span></div>
<div class="content">
<div class="icon">🩺</div>
<div class="title">FoldCheck</div>
<div class="subtitle">Unfold to inspect</div>
<div class="card">
<div class="card-label">Last check</div>
<div class="card-value">Oct 13 • 87/100</div>
</div>
<div class="btn">Quick Touch Test</div>
<div class="footer">Tap to run outer display test</div>
</div>
</div>
</div>
</body>
</html>
