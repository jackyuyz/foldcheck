<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro', 'Helvetica Neue', sans-serif; background: #f5f5f7; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
.iphone { width: 390px; height: 844px; background: #000; border-radius: 50px; padding: 15px; }
.screen { width: 100%; height: 100%; background: #fff; border-radius: 40px; overflow: hidden; position: relative; }
.status-bar { height: 44px; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; }
.time { font-size: 15px; font-weight: 600; }
.nav-bar { height: 44px; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid #e5e5e5; }
.nav-title { font-size: 17px; font-weight: 600; }
.content { padding: 16px; }
.icon { font-size: 60px; text-align: center; margin: 20px 0; }
.title { font-size: 22px; font-weight: 700; text-align: center; margin-bottom: 8px; }
.subtitle { font-size: 15px; color: #8e8e93; text-align: center; margin-bottom: 20px; }
.btn-primary { background: #007aff; color: white; padding: 16px; border-radius: 12px; text-align: center; font-weight: 600; margin-bottom: 12px; }
.card { background: #f2f2f7; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
.card-title { font-weight: 600; margin-bottom: 8px; font-size: 15px; }
.card-row { display: flex; justify-content: space-between; align-items: center; }
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 4px 8px; border-radius: 12px; font-size: 12px; font-weight: 600; background: #d1fae5; color: #059669; }
.score { font-size: 12px; color: #8e8e93; margin-left: 8px; }
.section-title { font-weight: 600; margin: 16px 0 8px; font-size: 15px; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.action-card { background: #f2f2f7; border-radius: 12px; padding: 12px; text-align: center; }
.action-icon { font-size: 24px; margin-bottom: 4px; }
.action-title { font-size: 13px; font-weight: 600; }
.tab-bar { position: absolute; bottom: 0; left: 0; right: 0; height: 83px; background: rgba(255,255,255,0.95); border-top: 1px solid #e5e5e5; display: flex; justify-content: space-around; align-items: flex-start; padding-top: 8px; }
.tab { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10px; color: #8e8e93; }
.tab.active { color: #007aff; }
.tab-icon { font-size: 24px; }
</style>
</head>
<body>
<div class="iphone">
<div class="screen">
<div class="status-bar"><span class="time">9:41</span><span>100%</span></div>
<div class="nav-bar"><span class="nav-title">FoldCheck</span></div>
<div class="content">
<div class="icon">🩺</div>
<div class="title">Foldable Inspector</div>
<div class="subtitle">Complete health check for your foldable iPhone</div>
<div class="btn-primary">▶ Start Inspection</div>
<div class="card">
<div class="card-title">Last Inspection</div>
<div class="card-row">
<div>
<div style="font-size: 14px; margin-bottom: 4px;">Oct 13, 2026</div>
<span class="badge">✓ Pass</span><span class="score">92/100</span>
</div>
<span style="color: #8e8e93; font-size: 20px;">›</span>
</div>
</div>
<div class="section-title">Quick Actions</div>
<div class="grid">
<div class="action-card"><div class="action-icon">🔄</div><div class="action-title">Hinge Check</div></div>
<div class="action-card"><div class="action-icon">👆</div><div class="action-title">Touch Test</div></div>
<div class="action-card"><div class="action-icon">📱</div><div class="action-title">Screen Test</div></div>
<div class="action-card"><div class="action-icon">📊</div><div class="action-title">Fold Stats</div></div>
</div>
</div>
<div class="tab-bar">
<div class="tab active"><div class="tab-icon">🏠</div>Home</div>
<div class="tab"><div class="tab-icon">🕐</div>History</div>
<div class="tab"><div class="tab-icon">🔍</div>Verify</div>
<div class="tab"><div class="tab-icon">⚙️</div>Settings</div>
</div>
</div>
</div>
</body>
</html>
