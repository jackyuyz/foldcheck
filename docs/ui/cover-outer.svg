  <rect x="10" y="10" width="180" height="280" rx="25" fill="#fff"/>
  
  <!-- Status Bar -->
  <text x="25" y="32" font-family="SF Pro, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#000">9:41</text>
  <text x="155" y="32" font-family="SF Pro, -apple-system, sans-serif" font-size="10" fill="#000">=ö=</text>
  
  <!-- Content -->
  <text x="100" y="80" font-size="28" text-anchor="middle">>z</text>
  <text x="100" y="105" font-family="SF Pro, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#000" text-anchor="middle">FoldCheck</text>
