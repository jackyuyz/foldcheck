<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <!-- iPhone Frame -->
  <rect x="0" y="0" width="390" height="844" rx="50" fill="#000"/>
  <rect x="15" y="15" width="360" height="814" rx="40" fill="#1c1c1e"/>
  
  <!-- Status Bar -->
  <text x="35" y="42" font-family="SF Pro, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#fff">9:43</text>
  <text x="320" y="42" font-family="SF Pro, -apple-system, sans-serif" font-size="12" fill="#fff">=ö =á =</text>
  
  <!-- Current Angle Display -->
  <text x="195" y="160" font-family="SF Pro, -apple-system, sans-serif" font-size="64" font-weight="700" fill="#fff" text-anchor="middle">127°</text>
  <text x="195" y="190" font-family="SF Pro, -apple-system, sans-serif" font-size="15" fill="#8e8e93" text-anchor="middle">Angle</text>
  
  <!-- Stats Box -->
  <rect x="30" y="220" width="330" height="200" rx="16" fill="#2c2c2e"/>
  
  <!-- Min/Max/Rate Stats -->
  <text x="85" y="270" font-family="SF Pro, -apple-system, sans-serif" font-size="24" font-weight="600" fill="#fff" text-anchor="middle">5°</text>
  <text x="85" y="290" font-family="SF Pro, -apple-system, sans-serif" font-size="12" fill="#8e8e93" text-anchor="middle">Min</text>
  
  <text x="195" y="270" font-family="SF Pro, -apple-system, sans-serif" font-size="24" font-weight="600" fill="#fff" text-anchor="middle">175°</text>
  <text x="195" y="290" font-family="SF Pro, -apple-system, sans-serif" font-size="12" fill="#8e8e93" text-anchor="middle">Max</text>
  
  <text x="305" y="270" font-family="SF Pro, -apple-system, sans-serif" font-size="24" font-weight="600" fill="#fff" text-anchor="middle">30 Hz</text>
  <text x="305" y="290" font-family="SF Pro, -apple-system, sans-serif" font-size="12" fill="#8e8e93" text-anchor="middle">Rate</text>
  
  <!-- Chart Area -->
  <rect x="50" y="310" width="290" height="90" rx="8" fill="#3c3c3e"/>
  
  <!-- Chart Line (simulated hinge sweep data) -->
  <polyline points="60,370 80,350 100,340 120,355 140,330 160,320 180,335 200,315 220,325 240,310 260,330 280,345 300,360 320,375" 
            fill="none" stroke="#007aff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Instruction -->
  <text x="195" y="480" font-family="SF Pro, -apple-system, sans-serif" font-size="15" fill="#8e8e93" text-anchor="middle">Close slowly, then open slowly...</text>
  
  <!-- Sweep Counter -->
  <rect x="130" y="520" width="130" height="40" rx="20" fill="#2c2c2e"/>
  <text x="195" y="547" font-family="SF Pro, -apple-system, sans-serif" font-size="14" fill="#fff" text-anchor="middle">Sweep 1 of 2</text>
  
  <!-- Progress indicators at bottom -->
  <circle cx="175" cy="620" r="6" fill="#007aff"/>
  <circle cx="195" cy="620" r="6" fill="#3c3c3e"/>
  <circle cx="215" cy="620" r="6" fill="#3c3c3e"/>
</svg>
