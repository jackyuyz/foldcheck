<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1cb86b"/>
      <stop offset="1" stop-color="#0a5c34"/>
    </linearGradient>
    <linearGradient id="left" x1="0" x2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".6" stop-color="#f1f3f6"/>
      <stop offset="1" stop-color="#b9c0cb"/>
    </linearGradient>
    <linearGradient id="right" x1="0" x2="1">
      <stop offset="0" stop-color="#b9c0cb"/>
      <stop offset=".4" stop-color="#f1f3f6"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="check" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#11904f"/>
      <stop offset="1" stop-color="#0b6a3b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#032915" flood-opacity=".45"/>
    </filter>
    <clipPath id="screen">
      <rect x="146" y="290" width="732" height="444" rx="58"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- Unfolded device body -->
  <rect x="112" y="256" width="800" height="512" rx="92" fill="#1c1e21" filter="url(#shadow)"/>

  <!-- Inner display: two halves shaded toward the center crease -->
  <g clip-path="url(#screen)">
    <rect x="146" y="290" width="366" height="444" fill="url(#left)"/>
    <rect x="512" y="290" width="366" height="444" fill="url(#right)"/>
    <rect x="508" y="290" width="8" height="444" fill="#8b93a1"/>
  </g>

  <!-- Check mark, vertex on the crease -->
  <polyline points="396,508 512,624 724,412" fill="none" stroke="url(#check)"
            stroke-width="80" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
